name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CSU ROTC Scanner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: SMARTPHONE/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Smartphone Dependencies
        run: |
          cd SMARTPHONE
          npm install

      - name: Build Web Application
        run: |
          cd SMARTPHONE
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd SMARTPHONE
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd SMARTPHONE/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSU-ROTC-Scanner-v1.0-debug.apk
          path: SMARTPHONE/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
