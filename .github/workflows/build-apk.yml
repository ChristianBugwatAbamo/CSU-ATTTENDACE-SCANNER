name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CSU ROTC Scanner APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SMARTPHONE

    env:
      CI: true
      CAPACITOR_TELEMETRY: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Build Web Application
        run: npx vite build

      - name: Sync Capacitor (regenerates capacitor-cordova-android-plugins)
        run: |
          npx cap telemetry off || true
          npx cap sync android

      - name: Verify Capacitor Plugin Files Exist
        run: |
          echo "=== Checking capacitor-cordova-android-plugins ==="
          ls -la android/capacitor-cordova-android-plugins/
          echo "=== cordova.variables.gradle ==="
          cat android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Stage APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/build-apk-output
          cp -v android/app/build/outputs/apk/debug/*.apk $GITHUB_WORKSPACE/build-apk-output/
          ls -la $GITHUB_WORKSPACE/build-apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSU-ROTC-Scanner-v1.0-debug
          path: build-apk-output/*.apk
          retention-days: 30
