name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CSU ROTC Scanner APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SMARTPHONE

    env:
      CI: true
      CAPACITOR_TELEMETRY: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean & Install Linux Dependencies
        run: |
          rm -rf node_modules
          npm install --include=dev

      - name: Build Web Application
        run: npx vite build

      - name: Copy Web Assets to Android
        run: |
          npx cap telemetry off || true
          npx cap copy android || (mkdir -p android/app/src/main/assets/public && cp -r dist/* android/app/src/main/assets/public/)

      - name: Build Debug APK with Gradle
        working-directory: SMARTPHONE/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_output.txt

      - name: Upload Build Log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log.txt
          path: SMARTPHONE/android/gradle_output.txt

      - name: Locate and Stage APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/build-apk-output
          find . -name "*.apk" -exec cp -v {} $GITHUB_WORKSPACE/build-apk-output/ \;
          ls -la $GITHUB_WORKSPACE/build-apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSU-ROTC-Scanner-v1.0-debug
          path: build-apk-output/*.apk
          retention-days: 30
