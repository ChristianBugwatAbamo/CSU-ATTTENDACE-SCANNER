name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CSU ROTC Scanner APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SMARTPHONE

    env:
      CI: true
      CAPACITOR_TELEMETRY: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean & Install Linux Dependencies
        run: |
          rm -rf node_modules
          npm install --include=dev

      - name: Build Web Application
        run: npx vite build

      - name: Sync Capacitor Android
        run: |
          npx cap telemetry off || true
          npm run cap:sync

      - name: Build Debug APK with Gradle
        working-directory: SMARTPHONE/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSU-ROTC-Scanner-v1.0-debug.apk
          path: SMARTPHONE/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
